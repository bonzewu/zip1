[project]
name = "zipcode-helper"
version = "1.0.0"
description = "台灣地址六碼(3+3)郵遞區號查詢小幫手,資料來源為 zip5.5432.tw API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bonzewu", email = "bonzewu1213@gmail.com" }]
keywords = ["taiwan", "zipcode", "postal-code", "cli", "郵遞區號"]
# 僅需 certifi 提供 CA 憑證;macOS 上以 python.org 安裝的 Python 若未執行過
# Install Certificates.command,沒有它會無法完成 HTTPS 憑證驗證。
# 其餘功能一律使用標準函式庫,程式在缺少 certifi 時也能改用系統憑證運作。
dependencies = ["certifi>=2024.2.2"]

[project.scripts]
zipcode = "zipcode_helper.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zipcode_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "e2e: 需要連線真實 zip5.5432.tw API 的端對端測試(預設不執行,加 --run-e2e 才跑)",
]
