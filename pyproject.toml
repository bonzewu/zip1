[project]
name = "zipcode-helper"
version = "1.0.0"
description = "台灣地址六碼(3+3)郵遞區號查詢小幫手,資料來源為 zip5.5432.tw API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bonzewu", email = "bonzewu1213@gmail.com" }]
keywords = ["taiwan", "zipcode", "postal-code", "cli", "郵遞區號"]
# 僅需 certifi 提供 CA 憑證;macOS 上以 python.org 安裝的 Python 若未執行過
# Install Certificates.command,沒有它會無法完成 HTTPS 憑證驗證。
# 其餘功能一律使用標準函式庫,程式在缺少 certifi 時也能改用系統憑證運作。
dependencies = ["certifi>=2024.2.2"]

[project.scripts]
zipcode = "zipcode_helper.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zipcode_helper"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle 錯誤
    "F",    # pyflakes
    "W",    # pycodestyle 警告
    "I",    # isort:import 排序
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit:安全性
    "RUF",  # ruff 專屬規則
]

[tool.ruff.lint.per-file-ignores]
# 測試中大量使用 assert,且會刻意連向本機測試伺服器與檢查子行程回傳碼
"tests/*" = [
    "S101",   # 允許 assert
    "S603",   # 允許以子行程執行 CLI
    "S310",   # 允許對本機測試伺服器發出 urlopen 請求
    "N802",   # 測試函式刻意以中文命名,提高失敗訊息的可讀性
    "RUF001", # 測試資料保留 API 實際回傳的全形數字(如「羅斯福路４段」)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "e2e: 需要連線真實 zip5.5432.tw API 的端對端測試(預設不執行,加 --run-e2e 才跑)",
]
