name: 真實 API 檢查

# 定期確認 zip5.5432.tw 的回應格式沒有改變。
# 刻意與 CI 分開:每次推送都打真實 API 會消耗站方配額(每日上限約 2000 次),
# 因此只在每週排程與手動觸發時執行。
on:
  schedule:
    # 每週一 09:00(台北時間,即 UTC 01:00)
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: 對 zip5.5432.tw 執行端對端測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安裝 uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: 建立虛擬環境
        run: uv venv --python 3.14

      - name: 安裝相依套件
        run: uv pip install -e '.[dev]'

      - name: 執行端對端測試(含真實 API)
        run: uv run pytest -q --run-e2e -m e2e
